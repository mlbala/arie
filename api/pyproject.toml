[project]
name = "arie-api"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "arie-worker",
    "fastapi>=0.115.0",
    "gepa>=0.1.4,<0.2",
    "uvicorn>=0.30.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arie_api"]
