[project]
name = "arie-core"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.19.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arie_core"]
