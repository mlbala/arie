[project]
name = "arie-worker"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "pikepdf>=10.18.0",
    "psutil>=7.0.0",
    "pymupdf>=1.26,<2",
    "pydantic>=2.10.0",
    "types-psutil>=7.0.0",
]

[project.optional-dependencies]
# OCR for figures drawn as bitmaps (``ingestion.figure_ocr``, S25); models ship in the wheel.
ocr = ["rapidocr-onnxruntime>=1.4.4,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["arie_worker"]
