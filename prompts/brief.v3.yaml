version: 3
name: brief
sections:
  - title: Executive summary
    prompt: "Summarize the paper's contribution, methods, results, and limitations in a concise briefing."
  - title: Key claims
    prompt: "List the strongest claims with direct evidence and precise citations."
  - title: Methods
    prompt: "Describe the experimental setup, datasets, baselines, or evaluation protocol used."
  - title: Results
    prompt: "Report the principal quantitative outcomes using exact numbers from the paper."
  - title: Limitations
    prompt: "Note unaddressed constraints, failure cases, and uncertainty in the study."
trusted_boundary:
  require_exact_quotes: true
  require_normalized_match: true
  require_semantic_entailment: true
