[project]
name = "arie-plugin-source-deepmind"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_source_deepmind"]
