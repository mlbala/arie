[project]
name = "arie-files-s3"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "arie-plugin-files-local",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }
arie-plugin-files-local = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_files_s3"]
