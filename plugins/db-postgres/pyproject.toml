[project]
name = "arie-db-postgres"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "arie-db-sqlite",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }
arie-db-sqlite = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_db_postgres"]
