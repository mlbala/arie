[project]
name = "arie-plugin-entail-nli-onnx"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "huggingface-hub>=0.24",
    "numpy>=2.0",
    "onnxruntime>=1.20",
    "tokenizers>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_entail_nli"]
