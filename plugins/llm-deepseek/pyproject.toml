[project]
name = "arie-llm-deepseek"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_llm_deepseek"]
