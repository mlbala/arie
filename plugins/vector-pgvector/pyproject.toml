[project]
name = "arie-vector-pgvector"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "numpy>=2.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_vector_pgvector"]
