[project]
name = "arie-plugin-parser-pymupdf4llm"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "arie-core",
    "pymupdf4llm>=0.0.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
arie-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["arie_parser_pymupdf4llm"]
