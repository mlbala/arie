profile: hybrid
# Publication dates are UTC; range end months are inclusive.
# UI: Sync options -> Save defaults writes this block atomically.
sync:
  mode: relative
  initial_months: 6
  batch_size: 20
  max_papers: 100
runtime_qos:
  slow_callback_threshold_ms: 15.0
  utility_worker_processes: 4  # PDF workers; capped to the CPUs Docker or the OS allows
# Select a provider in Settings or change plugins.llm.use below.
# API keys stay on the server in .env; the UI displays presence and connection checks.
# context_tokens is the window explain mode plans for. These are the windows the providers'
# own docs state for the models below (checked 2026-11-04; sources in
# docs/explain-mode/PROGRESS.md). Change the model, recheck its window.
llm_providers:
  deepseek: {model: deepseek-flash, api_key_env: DEEPSEEK_API_KEY, context_tokens: 1000000}
  openai: {model: gpt-5.4-mini, api_key_env: OPENAI_API_KEY, context_tokens: 400000}
  gemini: {model: gemini-3.5-flash-lite, api_key_env: GEMINI_API_KEY, context_tokens: 1048576}
# Explain mode (ADR 0010): the whole paper goes in the prompt when its estimated tokens are
# at most this share of the provider's context_tokens; a longer paper gets the paged pack.
explain:
  max_pack_share: 0.6
# Embedder defaults; min_score is the cosine floor calibrated for each model.
embedding_providers:
  fastembed: {model: BAAI/bge-small-en-v1.5, min_score: 0.6}
  openai: {model: text-embedding-3-small, min_score: 0.25, api_key_env: OPENAI_API_KEY}
  gemini: {model: gemini-embedding-001, min_score: 0.55, api_key_env: GEMINI_API_KEY}
plugins:
  llm:          {use: deepseek}  # model defaults come from llm_providers above
  # Vector search finds passages worded differently from the question. `auto` follows the
  # model provider (OpenAI or Gemini embeddings when that key is set; DeepSeek has none, so
  # local fastembed). Name an embedder to override. A new model re-embeds in the background.
  # Bring your own store: add a @plugin(slot="vector_store", name=...) class under plugins/
  # (or an installed package with an arie.plugins entry point), select it here, and run
  # `make test-contracts`. Other keys are passed to the plugin's constructor.
  # Set either `use` to none for keyword-only retrieval.
  embedder:     {use: fastembed}  # local ONNX model in arie-worker; no API quota
  vector_store: {use: exact, path: ./data/arie-vectors.db}
  # Tier 3 of the quote verifier: a local NLI model checks that each summary claim is
  # entailed by its own quote. Runs in arie-worker; the model (~280 MB) downloads on first
  # start. Claims scoring below min_score are dropped. `none` leaves Tiers 1-2 + reviewer.
  entailment:   {use: nli-onnx, model: cross-encoder/nli-deberta-v3-xsmall, min_score: 0.5}
  # Reranker: a local cross-encoder (~90 MB, downloads on first start) picks each answer's
  # passages from the keyword and vector candidates. Runs in arie-worker. `none` keeps the
  # keyword/vector order.
  reranker:     {use: onnx-cross-encoder, model: cross-encoder/ms-marco-MiniLM-L6-v2}
  database:     {use: sqlite, path: ./data/arie.db}
  file_storage: {use: local, root: ./data/papers}
  # Worker limits: timeout_sec (60), max_rss_mb (1536) and tasks_per_worker (20); other
  # keys go to the parser. Docling (`uv sync --extra docling`) needs raised limits and
  # runtime_qos.utility_worker_processes: 1:
  # parser: {use: docling, timeout_sec: 300, tasks_per_worker: 1, max_rss_mb: 2560}
  parser:       {use: pymupdf4llm}
  sources:      [arxiv, deepmind]
