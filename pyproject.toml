[project]
name = "arie-workspace"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "msgspec>=0.19.0",
    "pydantic>=2.10.0",
    "uvloop>=0.21.0; sys_platform != 'win32'",
    "httpx[http2]>=0.28.0",
    "opentelemetry-api>=1.29.0",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "arie-core",
    "arie-api",
    "arie-worker",
    "arie-sdk",
    "arie-db-sqlite",
    "arie-plugin-files-local",
    "arie-llm-deepseek",
    "arie-llm-openai-compatible",
    "arie-llm-gemini",
    "arie-plugin-embed-fastembed",
    "arie-plugin-entail-nli-onnx",
    "arie-plugin-parser-pymupdf4llm",
    "arie-plugin-source-arxiv",
    "arie-plugin-source-deepmind",
    "arie-plugin-vector-exact",
]

[project.optional-dependencies]
# Docling parser with OCR for scanned PDFs; pulls PyTorch models. `uv sync --extra docling`.
docling = ["arie-plugin-parser-docling"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "hypothesis>=6.122.0",
    "ruff>=0.9.0",
    "pyright>=1.1.390",
    "import-linter>=2.1",
]

[tool.uv.workspace]
members = ["core", "api", "worker", "sdk", "plugins/*"]

[tool.uv.sources]
arie-core = { workspace = true }
arie-api = { workspace = true }
arie-worker = { workspace = true }
arie-sdk = { workspace = true }
arie-db-sqlite = { workspace = true }
arie-plugin-files-local = { workspace = true }
arie-llm-deepseek = { workspace = true }
arie-llm-openai-compatible = { workspace = true }
arie-llm-gemini = { workspace = true }
arie-plugin-embed-fastembed = { workspace = true }
arie-plugin-entail-nli-onnx = { workspace = true }
arie-plugin-parser-docling = { workspace = true }
# Docling's PyTorch comes from the CPU-only index: no multi-GB CUDA libraries in images.
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
arie-plugin-parser-pymupdf4llm = { workspace = true }
arie-plugin-source-arxiv = { workspace = true }
arie-plugin-source-deepmind = { workspace = true }
arie-plugin-vector-exact = { workspace = true }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM", "RET"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = ["core", "plugins/db-sqlite", "api", "worker"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # PyMuPDF's SWIG bindings and Starlette's TestClient warn on Python 3.14; not ours.
    "ignore:builtin type [Ss]wig.* has no __module__ attribute:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.importlinter]
root_packages = ["arie_core", "arie_api", "arie_worker"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Invariant I5: Core never imports plugins, API, worker, or vendor SDKs"
type = "forbidden"
source_modules = ["arie_core"]
forbidden_modules = [
    "arie_api",
    "arie_worker",
    "fastapi",
    "openai",
    "anthropic",
    "qdrant_client",
    "weaviate",
    "fitz",
    "pymupdf4llm",
    "fastembed",
]
